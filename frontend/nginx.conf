server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # CPM Excel files can be several MB (the real file is ~3MB). The Nginx
    # default cap is 1MB, which silently rejected large uploads with a 413
    # before they ever reached the backend. Allow up to 50MB.
    client_max_body_size 50M;

    # Single-page app: any unknown path falls back to index.html
    # so React's own navigation (once we add more pages) works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Anything starting with /api/ is forwarded to the backend container.
    # The trailing slash on both sides strips "/api" before forwarding —
    # so the browser calls /api/auth/login and the backend still just
    # sees /auth/login, unchanged.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
